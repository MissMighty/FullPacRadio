<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Full PAC — Vote</title>
<style>
:root{--bg:#090909;--card:#141414;--line:#2c2c2c;--text:#f6f2e8;--muted:#aaa;--gold:#d7ad4a;--green:#55d68b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}a{color:var(--gold);text-decoration:none}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}main{max-width:760px;margin:auto;padding:30px 16px 70px}
h1{font-size:clamp(38px,10vw,78px);margin:12px 0 4px}.muted{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);padding:20px;margin-top:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.artist{border:1px solid var(--line);padding:18px;min-width:0}.artist h2{margin:0 0 4px}
button{width:100%;min-height:52px;border:0;background:var(--gold);color:#080808;font-weight:900;font-size:17px;cursor:pointer;margin-top:14px}button:disabled{opacity:.45;cursor:not-allowed}
.count{font-size:34px;font-weight:900}.bar{height:8px;background:#272727;margin-top:8px}.fill{height:100%;background:var(--gold);width:0}input{width:100%;min-height:48px;margin-top:12px;background:#090909;border:1px solid var(--line);color:var(--text);padding:0 12px;font-size:16px}
.msg{min-height:24px;margin-top:14px;color:var(--green);font-weight:700}.closed{padding:34px 20px;text-align:center}@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><strong>FULL PAC · VOTE</strong><a href="battle.html">← Live Battle</a></header>
<main>
  <div class="muted">Audience voting</div><h1>CAST YOUR VOTE</h1>
  <p class="muted">Voting starts at zero and updates from the live battle database.</p>
  <section id="closed" class="card closed">No active battle right now.</section>
  <section id="voting" class="card" hidden>
    <label for="fanName">Display name (optional)</label>
    <input id="fanName" maxlength="30" placeholder="Fan">
    <div class="grid">
      <article class="artist"><h2 id="nameA">Artist A</h2><div id="genreA" class="muted">—</div><div class="count" id="countA">0</div><div class="muted">votes · <span id="pctA">0</span>%</div><div class="bar"><div id="barA" class="fill"></div></div><button id="voteA" type="button">VOTE A</button></article>
      <article class="artist"><h2 id="nameB">Artist B</h2><div id="genreB" class="muted">—</div><div class="count" id="countB">0</div><div class="muted">votes · <span id="pctB">0</span>%</div><div class="bar"><div id="barB" class="fill"></div></div><button id="voteB" type="button">VOTE B</button></article>
    </div>
    <div class="msg" id="msg" aria-live="polite"></div>
  </section>
</main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getDatabase,ref,push,onValue}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const cfg={
  apiKey:"AIzaSyDBhhAl3L5NSy-vs6kqk4W8c2XMQnsaLP4",
  authDomain:"fullpacentertainment-73f8f.firebaseapp.com",
  databaseURL:"https://fullpacentertainment-73f8f-default-rtdb.firebaseio.com",
  projectId:"fullpacentertainment-73f8f",
  storageBucket:"fullpacentertainment-73f8f.firebasestorage.app",
  messagingSenderId:"680781752185",
  appId:"1:680781752185:web:4ceb73f0e73c1823be71a8"
};
const db=getDatabase(initializeApp(cfg)),el=id=>document.getElementById(id);
let active=false,open=true,voted=false;
function buttons(){el('voteA').disabled=!active||!open||voted;el('voteB').disabled=!active||!open||voted}
onValue(ref(db,'battle/live'),s=>{
 const b=s.val();active=!!(b&&b.status!=='ended');el('closed').hidden=active;el('voting').hidden=!active;
 if(active){const a=b.artistA||{},c=b.artistB||{};el('nameA').textContent=a.name||'Artist A';el('genreA').textContent=a.genre||'—';el('nameB').textContent=c.name||'Artist B';el('genreB').textContent=c.genre||'—'}
 buttons();
});
onValue(ref(db,'battle/settings'),s=>{const x=s.val()||{};open=x.votingOpen!==false;el('msg').textContent=open?'':'Voting is currently closed.';buttons()});
onValue(ref(db,'battle/votes'),s=>{
 const rows=s.val()?Object.values(s.val()):[],a=rows.filter(v=>v.choice==='A').length,b=rows.filter(v=>v.choice==='B').length,t=a+b;
 const pa=t?Math.round(a/t*100):0,pb=t?100-pa:0;
 el('countA').textContent=a;el('countB').textContent=b;el('pctA').textContent=pa;el('pctB').textContent=pb;el('barA').style.width=pa+'%';el('barB').style.width=pb+'%';
});
async function cast(choice){
 if(!active||!open||voted)return;
 const user=(el('fanName').value||'Fan').trim().slice(0,30)||'Fan';
 try{await push(ref(db,'battle/votes'),{choice,user,timestamp:Date.now()});voted=true;el('msg').textContent='Vote counted ✓';buttons()}
 catch(err){el('msg').textContent='Vote could not be submitted. Please try again.'}
}
el('voteA').addEventListener('click',()=>cast('A'));el('voteB').addEventListener('click',()=>cast('B'));buttons();
</script>
</body></html>
